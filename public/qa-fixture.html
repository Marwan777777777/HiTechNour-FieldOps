<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiTechNour FieldOps - QA Fixture (Employee & Admin Phase 2.2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B12;
      --surface: #0D1420;
      --elevated: #121B2A;
      --fg: #E8EDF5;
      --muted: #8B97AB;
      --faint: #5C6A80;
      --line: #1C2738;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-border: rgba(16, 185, 129, 0.35);
      --emerald-text: #34D399;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --amber-text: #FBBF24;
      --rose-bg: rgba(244, 63, 94, 0.12);
      --rose-border: rgba(244, 63, 94, 0.35);
      --rose-text: #FB7185;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --blue-border: rgba(59, 130, 246, 0.35);
      --blue-text: #60A5FA;
      --primary: #4A8FF0;
      --primary-fg: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020408;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--surface);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      max-width: 1100px;
      width: 100%;
      justify-content: center;
      align-items: center;
    }
    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .group-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-inline-end: 2px;
    }
    .btn {
      background: var(--elevated);
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #192438;
      border-color: #2D3D56;
    }
    .btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Stage Container */
    .viewport-stage {
      background: var(--bg);
      border: 2px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transition: width 0.2s ease;
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }
    .stage-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .stage-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow-y: auto;
    }

    /* Design System Shared Components */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 700;
    }
    .card-main {
      font-size: 16px;
      font-weight: 700;
      margin-top: 4px;
      color: var(--fg);
    }

    /* Buttons Component */
    .ui-btn {
      font-family: inherit;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .ui-btn-sm { height: 32px; padding: 0 10px; font-size: 12px; }
    .ui-btn-md { height: 40px; padding: 0 16px; font-size: 14px; }
    .ui-btn-lg { height: 48px; padding: 0 22px; font-size: 16px; border-radius: 10px; }
    .ui-btn-icon { height: 36px; width: 36px; padding: 0; border-radius: 8px; }

    .ui-btn-primary { background: var(--primary); color: #fff; }
    .ui-btn-outline { background: var(--elevated); color: var(--fg); border-color: var(--line); }
    .ui-btn-ghost { background: transparent; color: var(--muted); }
    .ui-btn-ghost:hover { background: var(--elevated); color: var(--fg); }
    .ui-btn-danger { background: rgba(244, 63, 94, 0.12); color: #FB7185; border-color: rgba(244, 63, 94, 0.35); }
    .ui-btn-success { background: rgba(16, 185, 129, 0.12); color: #34D399; border-color: rgba(16, 185, 129, 0.35); }

    /* StatusChips Component */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      border-radius: 9999px;
      line-height: 1;
      white-space: nowrap;
    }
    .status-chip-sm { padding: 3px 8px; font-size: 11px; }
    .status-chip-md { padding: 4px 10px; font-size: 12px; }
    .status-chip-ok { background: var(--emerald-bg); border: 1px solid var(--emerald-border); color: var(--emerald-text); }
    .status-chip-warn { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); }
    .status-chip-bad { background: var(--rose-bg); border: 1px solid var(--rose-border); color: var(--rose-text); }
    .status-chip-info { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text); }
    .status-chip-neutral { background: var(--elevated); border: 1px solid var(--line); color: var(--muted); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Form Inputs */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--fg); }
    .form-input {
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: 8px;
      height: 40px;
      padding: 0 12px;
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 143, 240, 0.25);
    }
    .form-input.error {
      border-color: #FB7185;
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2);
    }
    .form-hint { font-size: 11px; color: var(--muted); }
    .form-error { font-size: 11px; color: #FB7185; }

    /* Responsive Table & Card Styles */
    .table-container {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: start;
    }
    th {
      background: var(--elevated);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* Mobile Cards */
    .mobile-data-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mobile-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Sidebar Navigation Mockup */
    .sidebar-mock {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .nav-section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      padding-inline-start: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      background: transparent;
      cursor: pointer;
    }
    .nav-item.active {
      background: rgba(74, 143, 240, 0.12);
      color: var(--primary);
      border-inline-start: 3px solid var(--primary);
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      line-height: 1;
    }
    .nav-badge.warn { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
    .nav-badge.info { background: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Logical RTL styles */
    [dir="rtl"] { direction: rtl; text-align: right; }
    [dir="rtl"] table { text-align: right; }
  </style>
</head>

    function renderEmployeeView() {
      const d = I18N[currentLang];
      let bannerHtml = '';
      let chipHtml = '';
      let buttonHtml = '';
      let shiftHtml = '';

      if (employeeState === 'device_pending') {
        bannerHtml = `
          <div style="background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:12px; padding:12px 14px; color:var(--amber-text); font-size:12px; line-height:1.4;">

            <div>${d.deviceBody}</div>
            <div class="mono" style="margin-top:6px; font-size:11px; opacity:0.8;">ID: ${d.deviceId}</div>
          </div>
        `;
      }

      chipHtml = `
        <div style="background:var(--emerald-bg); border:1px solid var(--emerald-border); border-radius:12px; padding:12px 14px; color:var(--emerald-text); display:flex; flex-direction:column; gap:4px;">

      `;

      buttonHtml = `
        <button style="height:60px; width:100%; border-radius:16px; font-size:16px; font-weight:700; border:none; cursor:pointer; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;">
          <span>▶️ ${d.punchIn}</span>
        </button>
      `;

      shiftHtml = `
        <div class="card">
          <div class="card-title">${d.intervalsTitle}</div>
          <div style="margin-top:8px; font-size:13px; color:var(--muted); text-align:center; padding:12px 0;">No punches recorded yet today.</div>
        </div>
      `;

      return `
        ${bannerHtml}
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="card-title">${d.assignedTitle}</div>
              <div class="card-main">${d.siteName}</div>
            </div>
            <span class="mono" style="font-size:11px; background:var(--elevated); padding:3px 8px; border-radius:12px; border:1px solid var(--line); color:var(--muted);">${d.siteRadius}</span>
          </div>
          <div style="margin-top:6px; font-size:12px; color:var(--muted);">⏰ ${d.shiftWindow}</div>
        </div>
        ${chipHtml}
        ${buttonHtml}
        ${shiftHtml}
      `;
    }

    function render() {
      const sb = document.getElementById('stageBody');
      const sBadge = document.getElementById('stageBadge');
      if (currentMode === 'admin') {
        sBadge.textContent = 'Admin Redesign & Design System QA (Phase 2.2)';
        sb.innerHTML = renderAdminView();
      } else {
        sBadge.textContent = 'Employee Mobile Attendance QA (Phase 2.1)';
        sb.innerHTML = renderEmployeeView();
      }
    }

    function setMode(mode, el) {
      currentMode = mode;
      highlight(el);
      render();
    }

    function setWidth(w, el) {
      currentWidth = w;
      const stage = document.getElementById('stage');
      stage.style.width = typeof w === 'number' ? w + 'px' : w;
      highlight(el);
      render();
    }

    function setLang(lang, el) {
      currentLang = lang;
      document.getElementById('stage').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      highlight(el);
      render();
    }

    function highlight(btn) {
      btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    render();
  </script>
